# ─────────────────────────────────────────────────────────────────────────────
# CI Pipeline — runs on every push and pull request
#
# Jobs:
#   lint    → flake8 + black (fail fast on style violations)
#   test    → pytest with coverage
#
# Secrets used (configured in GitHub → Settings → Secrets → Actions):
#   OPENAI_API_KEY    — never logged, injected as env var, not echoed in steps
# ─────────────────────────────────────────────────────────────────────────────

name: CI

on:
  push:
    branches: ["**"]          # all branches
  pull_request:
    branches: ["**"]

permissions:
  contents: read              # principle of least privilege

jobs:
  # ── 1. Lint ────────────────────────────────────────────────────────────────
  lint:
    name: Lint (flake8 + black)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install linting deps
        run: pip install flake8==7.0.0 black==24.4.2

      - name: Run flake8
        run: flake8 . --max-line-length=100 --exclude=.git,__pycache__

      - name: Run black (check mode — does not modify files)
        run: black --check --line-length=100 .

  # ── 2. Test ────────────────────────────────────────────────────────────────
  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    needs: lint                # don't run tests if lint fails

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests with coverage
        # OPENAI_API_KEY is injected from GitHub Secrets.
        # It is NEVER printed, echoed, or logged.
        # The tests use mock LLM calls so the key is not actually needed
        # at test-time — we include it here as the pattern for real test suites.
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          pytest tests/ -v --tb=short \
            --cov=part1_token_optimization \
            --cov=part2_debugging \
            --cov-report=term-missing \
            --cov-fail-under=80

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: .coverage
          retention-days: 7
